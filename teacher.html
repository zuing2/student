<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3학년 교무실 스마트 수신 대시보드</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body class="teacher-bg">
  <div class="dashboard-container">
    <header class="dashboard-header">
      <div class="header-title">
        <div class="title-badge">SMART FACULTY BOARD</div>
        <h1>3학년 교무실 실시간 방문 호출 현황</h1>
        <p class="status-indicator">
          <span class="dot"></span>
          <span>실시간 웹소켓 서버 연동 중 (음성 및 음향 준비완료)</span>
        </p>
      </div>
      <button id="audioTestBtn" onclick="enableAudio()" class="audio-enable-btn">
        🔊 알림 sound & TTS 활성화
      </button>
    </header>

    <main class="call-list-container">
      <div id="emptyNotice" class="empty-notice">
        <div class="empty-icon-wrap">☕</div>
        <h3>현재 대기 중인 호출이 없습니다.</h3>
        <p>문 밖에서 학생이 호출을 누르면 음성 알림과 함께 카드가 생성됩니다.</p>
      </div>
      <div id="callList" class="call-grid"></div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    initTeacherDashboard();
  </script>
</body>
</html>
